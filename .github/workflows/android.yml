name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
      - name: Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: diplay-debug-apk
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    permissions:
      contents: write
    concurrency:
      group: android-release-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The fork keeps its release keystore under RELEASE_KEYSTORE_*; the upstream ANDROID_* names
      # are honoured too so this file still works unchanged on the upstream repository.
      # The CarPlay (MFi) assets are optional here: without them the APK is signed but carries no
      # MFi credentials, which our head units do not use.
      - name: Check the release keystore
        id: signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MFI_IDENTITY_BASE64: ${{ secrets.DIPLAY_AUTH_IDENTITY_BASE64 }}
          MFI_CERTIFICATE_BASE64: ${{ secrets.DIPLAY_AUTH_CERTIFICATE_BASE64 }}
        run: |
          keystore="${RELEASE_KEYSTORE_BASE64:-$ANDROID_KEYSTORE_BASE64}"
          store_password="${RELEASE_KEYSTORE_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          key_alias="${RELEASE_KEY_ALIAS:-$ANDROID_KEY_ALIAS}"
          key_password="${RELEASE_KEY_PASSWORD:-$ANDROID_KEY_PASSWORD}"
          if [[ -n "$keystore" && -n "$store_password" && -n "$key_alias" && -n "$key_password" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release is not configured. Add RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD as repository Actions secrets."
          fi
          if [[ -n "$MFI_IDENTITY_BASE64" && -n "$MFI_CERTIFICATE_BASE64" ]]; then
            echo "mfi=true" >> "$GITHUB_OUTPUT"
          else
            echo "mfi=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CarPlay authentication assets. The release is signed but carries no MFi credentials."
          fi
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.available == 'true'
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        if: steps.signing.outputs.available == 'true'
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.available == 'true'
      - name: Prepare release signing key
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="${RELEASE_KEYSTORE_BASE64:-$ANDROID_KEYSTORE_BASE64}"
          printf '%s' "$keystore" | base64 --decode > "$RUNNER_TEMP/diplay-release.jks"
      - name: Prepare CarPlay authentication assets
        if: steps.signing.outputs.available == 'true' && steps.signing.outputs.mfi == 'true'
        shell: bash
        env:
          MFI_IDENTITY_BASE64: ${{ secrets.DIPLAY_AUTH_IDENTITY_BASE64 }}
          MFI_CERTIFICATE_BASE64: ${{ secrets.DIPLAY_AUTH_CERTIFICATE_BASE64 }}
        run: |
          set -euo pipefail
          auth_dir="$RUNNER_TEMP/diplay-auth-assets/offline-mfi"
          mkdir -p "$auth_dir"
          printf '%s' "$MFI_IDENTITY_BASE64" | base64 --decode > "$auth_dir/identity.pk8"
          printf '%s' "$MFI_CERTIFICATE_BASE64" | base64 --decode > "$auth_dir/certificate.p7b"
          test -s "$auth_dir/identity.pk8"
          test -s "$auth_dir/certificate.p7b"
          openssl pkey -inform DER -in "$auth_dir/identity.pk8" -noout -check >/dev/null
          openssl pkcs7 -inform DER -in "$auth_dir/certificate.p7b" -print_certs -noout >/dev/null
          key_fingerprint="$(openssl pkey -inform DER -in "$auth_dir/identity.pk8" -pubout -outform DER | sha256sum | cut -d' ' -f1)"
          cert_fingerprint="$(openssl pkcs7 -inform DER -in "$auth_dir/certificate.p7b" -print_certs -outform PEM | openssl x509 -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)"
          if [[ "$key_fingerprint" != "$cert_fingerprint" ]]; then
            echo "::error::CarPlay identity and certificate do not match."
            exit 1
          fi
      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/diplay-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # An empty DIPLAY_AUTH_ASSETS_DIR would resolve to the project directory and the build
          # would look for the MFi assets there, so it is only set when the assets exist.
          if [[ "${{ steps.signing.outputs.mfi }}" == "true" ]]; then
            export DIPLAY_AUTH_ASSETS_DIR="$RUNNER_TEMP/diplay-auth-assets"
          fi
          ./gradlew :mobile:assembleRelease --stacktrace
      - name: Upload signed release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: diplay-release-apk
          path: |
            mobile/build/outputs/apk/release/*.apk
            mobile/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Read app version
        if: steps.signing.outputs.available == 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' mobile/build.gradle.kts | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "::error::Could not read app version from mobile/build.gradle.kts"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      # This fork builds the release APK for its own head units; it does not publish a GitHub
      # Release, so the same checksum is only recorded next to the APK inside the artifact.
      - name: Write checksums
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd mobile/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Remove temporary signing key
        if: always() && steps.signing.outputs.available == 'true'
        run: rm -f "$RUNNER_TEMP/diplay-release.jks" && rm -rf "$RUNNER_TEMP/diplay-auth-assets"
