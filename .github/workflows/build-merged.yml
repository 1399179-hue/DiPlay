# Builds the merged DiPlay APK (upstream main + the xcertplay ported fixes) on GitHub's
# runners, so no local JDK / Android SDK / NDK install is needed.
#
# The repo's own android.yml stops at a source-only debug build. This one signs a release
# APK: the mobile module already wires the ANDROID_KEYSTORE_* environment variables into
# its release signingConfig, so the job generates an ephemeral keystore and exports the
# four variables Gradle expects. The key lives and dies with the run - two builds are two
# different signatures, so installing one over the other needs an uninstall first.

name: Build merged DiPlay APK

on:
  workflow_dispatch:
    permissions:
      contents: read

concurrency:
  group: diplay-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Same JDK the upstream workflow pins; that combination is known to work with this
      # AGP / Kotlin pair. Do not downgrade without testing.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
            ndk;28.2.13676358

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A fixed release key, so a new build installs over the previous one. Without it every run
      # generated a fresh ephemeral key and Android refused the update with
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE, forcing an uninstall (and losing settings and CarPlay
      # pairing) before each install. The four RELEASE_KEYSTORE_* secrets hold one keystore.
      # If they are absent the build still succeeds, signed with an ephemeral key, and says so.
      - name: Prepare the release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_KEYSTORE_BASE64:-}" ]]; then
            echo "::warning::No RELEASE_KEYSTORE_BASE64 secret. Falling back to an ephemeral key: uninstall the previous build before installing this one, or add the four RELEASE_KEYSTORE_* secrets."
            keystore="${RUNNER_TEMP}/merged-release.jks"
            keytool -genkeypair \
              -keystore "${keystore}" \
              -storepass merged-build -keypass merged-build \
              -alias merged -keyalg RSA -keysize 2048 -validity 30 \
              -dname "CN=DiPlay merge build"
            {
              echo "ANDROID_KEYSTORE_PATH=${keystore}"
              echo "ANDROID_KEYSTORE_PASSWORD=merged-build"
              echo "ANDROID_KEY_ALIAS=merged"
              echo "ANDROID_KEY_PASSWORD=merged-build"
            } >> "${GITHUB_ENV}"
            exit 0
          fi
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::RELEASE_KEYSTORE_BASE64 is set but ${name} is not"
              exit 1
            fi
          done
          keystore="${RUNNER_TEMP}/diplay-release.jks"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          keytool -list -keystore "${keystore}" \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" -alias "${ANDROID_KEY_ALIAS}" > /dev/null
          {
            echo "ANDROID_KEYSTORE_PATH=${keystore}"
            echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
            echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
            echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"
          echo "Signing with the fixed release key (alias ${ANDROID_KEY_ALIAS})."

      # DiPlayBootstrap.ensure() needs assets/offline-mfi/{identity.pk8,certificate.p7b} at
      # runtime or the UI shows "无法加载 CarPlay 认证". mobile/build.gradle.kts only adds them
      # when DIPLAY_AUTH_ASSETS_DIR points at a directory holding offline-mfi/{the two files},
      # and its verification task rejects any other credential files. Prefer repository
      # secrets; fall back to extracting from a public DiPlay release APK (same fallback the
      # nomfi workflow uses).
      - name: Obtain offline MFi identity
        env:
          PK8_B64: ${{ secrets.MFI_IDENTITY_PK8_B64 }}
          P7B_B64: ${{ secrets.MFI_CERTIFICATE_P7B_B64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/auth-assets/offline-mfi"
          mkdir -p "${dest}"
          if [[ -n "${PK8_B64:-}" && -n "${P7B_B64:-}" ]]; then
            echo "Identity source: repository secrets"
            printf '%s' "${PK8_B64}" | base64 --decode > "${dest}/identity.pk8"
            printf '%s' "${P7B_B64}" | base64 --decode > "${dest}/certificate.p7b"
          else
            echo "Identity source: DiPlay release APK (no repository secrets configured)"
            # NOT /releases/latest: every DiPlay release is a prerelease, that endpoint 404s.
            api="https://api.github.com/repos/shihabal3amri/DiPlay/releases?per_page=20"
            url="$(curl -fsSL \
                      -H "Authorization: Bearer ${GH_TOKEN}" \
                      -H "Accept: application/vnd.github+json" \
                      "${api}" 2>/dev/null \
                    | jq -r '[.[] | select(.draft | not)] | .[0].assets[] | select(.name | endswith(".apk")) | .browser_download_url' \
                    | head -1 || true)"
            if [[ -z "${url}" || "${url}" == "null" ]]; then
              url="https://github.com/shihabal3amri/DiPlay/releases/download/v0.2.6/DiPlay-0.2.6.apk"
              echo "::warning::GitHub API did not return a release asset; using the pinned URL ${url}"
            fi
            echo "Downloading ${url}"
            curl -fsSL --retry 3 --retry-delay 5 "${url}" -o "${RUNNER_TEMP}/diplay.apk"
            unzip -o -q "${RUNNER_TEMP}/diplay.apk" 'assets/offline-mfi/*' -d "${RUNNER_TEMP}/diplay"
            cp "${RUNNER_TEMP}/diplay/assets/offline-mfi/identity.pk8" "${dest}/identity.pk8"
            cp "${RUNNER_TEMP}/diplay/assets/offline-mfi/certificate.p7b" "${dest}/certificate.p7b"
            rm -f "${RUNNER_TEMP}/diplay.apk"
            rm -rf "${RUNNER_TEMP}/diplay"
          fi
          ls -l "${dest}"

      - name: Build the release APK
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ runner.temp }}/auth-assets
        run: ./gradlew :mobile:assembleRelease --stacktrace

      - name: Verify and upload the APK
        run: |
          set -euo pipefail
          apk="$(find mobile/build/outputs/apk -type f -name '*release*.apk' -print -quit)"
          if [[ -z "${apk}" ]]; then
            echo "::error::No release APK was produced"
            exit 1
          fi
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --print-certs "${apk}"
          echo "--- artifact ---"
          ls -l "${apk}"
          sha256sum "${apk}"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: diplay-merged-${{ github.sha }}
          path: mobile/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
