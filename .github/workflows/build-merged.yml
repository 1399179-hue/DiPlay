# Builds the merged DiPlay APK (upstream main + the xcertplay ported fixes) on GitHub's
# runners, so no local JDK / Android SDK / NDK install is needed.
#
# The repo's own android.yml stops at a source-only debug build. This one signs a release
# APK: the mobile module already wires the ANDROID_KEYSTORE_* environment variables into
# its release signingConfig, so the job generates an ephemeral keystore and exports the
# four variables Gradle expects. The key lives and dies with the run - two builds are two
# different signatures, so installing one over the other needs an uninstall first.

name: Build merged DiPlay APK

on:
  workflow_dispatch:
    permissions:
      contents: read

concurrency:
  group: diplay-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Same JDK the upstream workflow pins; that combination is known to work with this
      # AGP / Kotlin pair. Do not downgrade without testing.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
            ndk;28.2.13676358

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate an ephemeral signing keystore
        run: |
          set -euo pipefail
          keystore="${RUNNER_TEMP}/merged-release.jks"
          keytool -genkeypair \
            -keystore "${keystore}" \
            -storepass merged-build -keypass merged-build \
            -alias merged -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=DiPlay merge build"
          {
            echo "ANDROID_KEYSTORE_PATH=${keystore}"
            echo "ANDROID_KEYSTORE_PASSWORD=merged-build"
            echo "ANDROID_KEY_ALIAS=merged"
            echo "ANDROID_KEY_PASSWORD=merged-build"
          } >> "${GITHUB_ENV}"

      - name: Build the release APK
        run: ./gradlew :mobile:assembleRelease --stacktrace

      - name: Verify and upload the APK
        run: |
          set -euo pipefail
          apk="$(find mobile/build/outputs/apk -type f -name '*release*.apk' -print -quit)"
          if [[ -z "${apk}" ]]; then
            echo "::error::No release APK was produced"
            exit 1
          fi
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --print-certs "${apk}"
          echo "--- artifact ---"
          ls -l "${apk}"
          sha256sum "${apk}"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: diplay-merged-${{ github.sha }}
          path: mobile/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
