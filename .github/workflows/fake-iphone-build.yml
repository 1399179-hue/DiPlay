name: Fake iPhone tester

on:
  push:
    branches: [main]
    paths:
      - 'fake-iphone/**'
      - '.github/workflows/fake-iphone-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the pure-JVM fake iPhone module
        run: ./gradlew :fake-iphone:build --stacktrace
